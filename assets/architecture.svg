<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="660" viewBox="0 0 1240 660" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4a5a"/>
    </marker>
    <marker id="arrowd" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a94a6"/>
    </marker>
    <style>
      .box { fill:#ffffff; stroke:#3b4a5a; stroke-width:1.5; rx:8; }
      .data { fill:#f4f7fb; stroke:#3b4a5a; stroke-width:1.5; }
      .title { font-size:15px; font-weight:600; fill:#1f2933; }
      .sub { font-size:12px; fill:#3b4a5a; }
      .lbl { font-size:11.5px; fill:#3b4a5a; }
      .lz { fill:#f8fafc; stroke:#7a8798; stroke-width:1.5; stroke-dasharray:6 4; rx:14; }
      .flow { stroke:#3b4a5a; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
      .ingest { stroke:#8a94a6; stroke-width:1.6; fill:none; stroke-dasharray:5 4; marker-end:url(#arrowd); }
      .pill { fill:#e8f0fe; stroke:none; rx:10; }
      .pilltxt { font-size:11px; fill:#1a4b8c; font-weight:600; }
    </style>
  </defs>

  <rect width="1240" height="660" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#1f2933">Contoso Customer Care Agent, reference architecture</text>
  <text x="24" y="56" class="sub">Private network, private endpoints and managed identities everywhere. No keys.</text>

  <!-- Landing zone boundary -->
  <rect x="300" y="84" width="916" height="540" class="lz"/>
  <text x="318" y="108" font-size="13" font-weight="600" fill="#5b6675">AI Landing Zone (spoke VNet, private endpoints, hub DNS)</text>

  <!-- User -->
  <rect x="30" y="250" width="200" height="86" class="box"/>
  <text x="130" y="282" text-anchor="middle" class="title">Customer Care rep</text>
  <text x="130" y="302" text-anchor="middle" class="sub">Teams / Copilot Studio</text>
  <text x="130" y="318" text-anchor="middle" class="sub">or web front end</text>

  <!-- APIM -->
  <rect x="330" y="250" width="180" height="86" class="box"/>
  <text x="420" y="282" text-anchor="middle" class="title">API Management</text>
  <text x="420" y="302" text-anchor="middle" class="sub">authentication, throttling</text>
  <text x="420" y="318" text-anchor="middle" class="sub">Content Safety policy</text>

  <!-- App -->
  <rect x="580" y="230" width="220" height="126" class="box"/>
  <text x="690" y="262" text-anchor="middle" class="title">Application</text>
  <text x="690" y="282" text-anchor="middle" class="sub">Function App / Container App</text>
  <rect x="612" y="296" width="70" height="20" class="pill"/>
  <text x="647" y="310" text-anchor="middle" class="pilltxt">/ingest</text>
  <rect x="698" y="296" width="70" height="20" class="pill"/>
  <text x="733" y="310" text-anchor="middle" class="pilltxt">/query</text>
  <text x="690" y="340" text-anchor="middle" class="sub">in this playbook: the Python scripts</text>

  <!-- Azure OpenAI -->
  <rect x="900" y="130" width="280" height="86" class="box"/>
  <text x="1040" y="160" text-anchor="middle" class="title">Azure OpenAI</text>
  <text x="1040" y="180" text-anchor="middle" class="sub">text-embedding-3-large (embed)</text>
  <text x="1040" y="196" text-anchor="middle" class="sub">gpt-4.1-mini (answer, judge)</text>

  <!-- AI Search -->
  <rect x="900" y="250" width="280" height="100" class="data" rx="8"/>
  <text x="1040" y="280" text-anchor="middle" class="title">Azure AI Search</text>
  <text x="1040" y="300" text-anchor="middle" class="sub">index contoso-kb: chunks + metadata</text>
  <text x="1040" y="316" text-anchor="middle" class="sub">hybrid (BM25 + vector) + semantic ranker</text>
  <text x="1040" y="332" text-anchor="middle" class="sub">filters, scoring profile prefer-current</text>

  <!-- Cosmos -->
  <rect x="900" y="384" width="280" height="86" class="data" rx="8"/>
  <text x="1040" y="414" text-anchor="middle" class="title">Cosmos DB</text>
  <text x="1040" y="434" text-anchor="middle" class="sub">ContosoCatalog: parts, crossReference</text>
  <text x="1040" y="450" text-anchor="middle" class="sub">exact lookup by part number</text>

  <!-- Blob -->
  <rect x="580" y="420" width="220" height="100" class="data" rx="8"/>
  <text x="690" y="450" text-anchor="middle" class="title">Blob Storage</text>
  <text x="690" y="470" text-anchor="middle" class="sub">container contoso-docs</text>
  <text x="690" y="486" text-anchor="middle" class="sub">current / archive / community</text>
  <text x="690" y="502" text-anchor="middle" class="sub">metadata on every blob</text>

  <!-- Redis -->
  <rect x="330" y="420" width="180" height="86" class="data" rx="8"/>
  <text x="420" y="450" text-anchor="middle" class="title">Managed Redis</text>
  <text x="420" y="470" text-anchor="middle" class="sub">answer cache</text>
  <text x="420" y="486" text-anchor="middle" class="sub">invalidated on ingest</text>

  <!-- Observability -->
  <rect x="330" y="548" width="850" height="56" class="box"/>
  <text x="755" y="572" text-anchor="middle" class="title">Log Analytics, Application Insights, evaluation results (scripts/eval)</text>
  <text x="755" y="592" text-anchor="middle" class="sub">every retrieval change is measured against data/eval/eval_set.jsonl before it ships</text>

  <!-- Flows -->
  <line x1="230" y1="293" x2="328" y2="293" class="flow"/>
  <line x1="510" y1="293" x2="578" y2="293" class="flow"/>

  <!-- App -> AOAI -->
  <path d="M800,262 C850,262 850,173 898,173" class="flow"/>
  <text x="820" y="150" class="lbl">embed, chat</text>

  <!-- App -> Search -->
  <line x1="800" y1="300" x2="898" y2="300" class="flow"/>
  <text x="808" y="292" class="lbl">query + filter</text>

  <!-- App -> Cosmos -->
  <path d="M800,330 C850,330 850,427 898,427" class="flow"/>
  <text x="905" y="372" class="lbl">lookup by part number key</text>

  <!-- App -> Blob (ingest read) -->
  <line x1="690" y1="356" x2="690" y2="418" class="ingest"/>
  <text x="700" y="392" class="lbl">read on /ingest</text>

  <!-- App <-> Redis -->
  <path d="M580,330 C540,330 540,463 512,463" class="ingest"/>
  <text x="520" y="390" class="lbl">cache</text>

  <!-- Blob -> Search (ingest push) -->
  <path d="M800,470 C860,470 860,340 898,340" class="ingest"/>
  <text x="812" y="500" class="lbl">chunk, embed, push (with metadata)</text>

  <!-- legend -->
  <line x1="30" y1="600" x2="70" y2="600" class="flow"/>
  <text x="78" y="604" class="lbl">request path</text>
  <line x1="30" y1="622" x2="70" y2="622" class="ingest"/>
  <text x="78" y="626" class="lbl">ingestion path</text>
</svg>
